<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settingsTitle">ReadPilot Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563EB;
      --primary-hover: #1d4ed8;
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --success: #22c55e;
      --error: #ef4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --bg: #0f172a;
        --bg-secondary: #1e293b;
        --text: #f1f5f9;
        --text-secondary: #94a3b8;
        --border: #334155;
      }
    }

    body {
      min-width: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .header svg {
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    input[readonly] {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: not-allowed;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .slider-value {
      min-width: 60px;
      text-align: right;
      font-size: 14px;
      font-weight: 500;
      color: var(--primary);
    }

    .instructions {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }

    .instructions h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .instructions ol {
      margin: 0;
      padding-left: 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .instructions li {
      margin-bottom: 4px;
    }

    .instructions a {
      color: var(--primary);
      text-decoration: none;
    }

    .instructions a:hover {
      text-decoration: underline;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      flex: 1;
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-secondary);
    }

    .status {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 16px;
    }

    .status.show {
      display: flex;
    }

    .status.success {
      background: rgba(34, 197, 94, 0.1);
      color: var(--success);
    }

    .status.error {
      background: rgba(239, 68, 68, 0.1);
      color: var(--error);
    }

    .status-icon {
      width: 18px;
      height: 18px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .template-select {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
    }

    .template-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .template-card {
      transition: border-color 0.2s;
    }

    .template-card:hover {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="14" stroke="#2563EB" stroke-width="2.5"/>
      <path d="M10 16C10 12.6863 12.6863 10 16 10C18.0059 10 19.8672 10.9299 21.1602 12.4966" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M22 16C22 19.3137 19.3137 22 16 22C13.9941 22 12.1328 21.0701 10.8398 19.5034" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="3" fill="#2563EB"/>
    </svg>
    <h1 data-i18n="settingsHeader">ReadPilot Settings</h1>
  </div>

  <div class="section">
    <h2 class="section-title" data-i18n="apiConfig">API Configuration</h2>
    
    <div class="form-group">
      <label for="apiKey" data-i18n="apiKeyLabel">API Key</label>
      <input type="password" id="apiKey" placeholder data-i18n-placeholder="apiKeyPlaceholder" autocomplete="off">
      <div class="instructions">
        <h4 data-i18n="howToGetApiKey">How to get your API key:</h4>
        <ol>
          <li>Visit <a href="https://platform.deepseek.com" target="_blank" data-i18n="deepSeekPlatform">DeepSeek Platform</a></li>
          <li data-i18n="createAccount">Create an account or sign in</li>
          <li data-i18n="navigateToApiKeys">Navigate to API Keys section</li>
          <li data-i18n="copyApiKey">Create a new API key and copy it here</li>
        </ol>
      </div>
    </div>

    <div class="form-group">
      <label for="apiProvider" data-i18n="apiProvider">API Provider</label>
      <select id="apiProvider" class="template-select">
        <option value="deepseek" data-i18n="providerDeepSeek">DeepSeek</option>
        <option value="openai" data-i18n="providerOpenAI">OpenAI</option>
        <option value="anthropic" data-i18n="providerAnthropic">Anthropic</option>
        <option value="custom" data-i18n="providerCustom">Custom</option>
      </select>
    </div>

    <div class="form-group">
      <label for="apiBaseUrl" data-i18n="apiBaseUrlLabel">API Base URL</label>
      <input type="text" id="apiBaseUrl" placeholder="https://api.example.com/v1">
    </div>

    <div class="form-group">
      <label for="maxTokens" data-i18n="maxTokensLabel">Max Tokens</label>
      <div class="slider-container">
        <input type="range" id="maxTokens" min="100" max="2000" value="1000" step="100">
        <span class="slider-value" id="maxTokensValue">1000</span>
      </div>
    </div>
  </div>

  <div class="section" id="templateSection">
    <!-- Templates will be rendered here by JavaScript -->
  </div>

  <div class="btn-row">
    <button id="saveBtn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M13.5 4.5L6 12L2.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span data-i18n="saveAndTest">Save & Test</span>
    </button>
    <button id="resetBtn" class="btn btn-secondary" data-i18n="resetToDefault">Reset to Default</button>
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    <svg class="status-icon" viewBox="0 0 18 18" fill="none">
      <circle cx="9" cy="9" r="8" stroke="currentColor" stroke-width="2"/>
      <path class="check" d="M5.5 9L8 11.5L12.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>
      <path class="error-x" d="M6 6L12 12M12 6L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/>
    </svg>
    <span id="statusText"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
